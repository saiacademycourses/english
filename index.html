<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Custom YouTube Player with Watermark</title>
  <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
  <style>
    #watermark {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(0,0,0,0.7);
      color: #fff;
      padding: 8px 15px;
      border-radius: 5px;
      cursor: move;
      z-index: 1000;
      user-select: none;
      font-family: Arial, sans-serif;
      font-size: 14px;
    }
    .player-container {
      position: relative;
      width: 640px;
      margin: auto;
    }
    /* Hide YouTube's native controls */
    .plyr__video-wrapper iframe {
      pointer-events: none;
    }
    /* Custom Plyr controls styling */
    .plyr--video .plyr__controls {
      background: rgba(0,0,0,0.8);
    }
  </style>
</head>
<body>
  <div class="player-container">
    <div id="watermark">Sai Academy</div>
    <div id="player" data-plyr-provider="youtube" data-plyr-embed-id="yvJ3V5j5Z1I"></div>
  </div>
  <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
  <script>
    // Initialize Plyr with more restrictive settings
    const player = new Plyr('#player', {
      controls: ['play', 'progress', 'current-time', 'mute', 'volume', 'fullscreen'],
      youtube: {
        noCookie: true,
        rel: 0,
        showinfo: 0,
        modestbranding: 1,
        controls: 0,
        disablekb: 1,
        fs: 0,
        iv_load_policy: 3,
        cc_load_policy: 0,
        autoplay: 0
      },
      hideControls: true,
      resetOnEnd: false
    });

    // Draggable watermark
    const watermark = document.getElementById('watermark');
    let isDragging = false, offsetX, offsetY;

    watermark.addEventListener('mousedown', function(e) {
      isDragging = true;
      offsetX = e.clientX - watermark.offsetLeft;
      offsetY = e.clientY - watermark.offsetTop;
      document.body.style.userSelect = 'none';
    });

    document.addEventListener('mousemove', function(e) {
      if (isDragging) {
        watermark.style.left = (e.clientX - offsetX) + 'px';
        watermark.style.top = (e.clientY - offsetY) + 'px';
      }
    });

    document.addEventListener('mouseup', function() {
      isDragging = false;
      document.body.style.userSelect = '';
    });

    // Additional: Hide any remaining YouTube elements
    player.on('ready', function() {
      // Hide YouTube's title and other elements
      const iframe = document.querySelector('.plyr__video-wrapper iframe');
      if (iframe) {
        iframe.style.pointerEvents = 'none';
      }
    });
  </script>
</body>
</html>
